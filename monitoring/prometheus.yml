global:
  scrape_interval: 15s

# 🔔 Alert rules location
rule_files:
  - /etc/prometheus/alerts.yml

# 🚨 Alertmanager connection
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
    

scrape_configs:
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "backend_health"
    static_configs:
      - targets: ["backend:5000"]
